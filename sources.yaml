# ═══════════════════════════════════════════════════════════════════════════════
#  PhD Radar – list of sources
#
#  This is the only file you need to edit to add or remove a source.
#  Each entry starts with "- name:". The fields are:
#
#    name        unique label shown on the dashboard                   (required)
#    url         the page to read; can also be a list of pages         (required)
#    type        html   – a page listing postings (default)
#                rss    – an RSS/Atom feed
#                watch  – a single page (graduate school, group, call) that is
#                         checked for changes; new lines are shown on the dashboard
#    kind        position (default) | school | group   – just for grouping
#    country     used when a posting does not name a country itself
#    filter      what a posting must mention to be kept (default [phd, math]):
#                  phd   – a doctoral term (PhD, doctoral, Doktorand, dottorato…)
#                  math  – a mathematics term
#                  topic – at least one keyword of one of you (see profiles.yaml)
#    details     true = open each new posting to read its full text (better
#                scoring and deadlines); max_details caps how many per run (20)
#    link_pattern  regular expression the posting links must match, e.g. /jobs/\d+
#    links: raw    find links anywhere in the page source (sitemaps, JS pages)
#    item / link   CSS selectors for listing cards and their link (optional;
#                  without them every link on the page is considered)
#    pages / page_param / page_start   follow pagination (?page=1, ?page=2…)
#    europe_only true = drop postings that do not mention a European country
#    enabled     false = keep the entry but skip it
#
#  Simplest possible new source (a department page to watch):
#
#    - name: Utrecht – Mathematics vacancies
#      type: watch
#      url: https://example.org/vacancies
#      kind: school
#
#  Or just ask Claude: "add this source: <url>".
# ═══════════════════════════════════════════════════════════════════════════════

defaults:
  delay: 2          # seconds between two requests to the same website

sources:

# ─── Europe-wide job boards ────────────────────────────────────────────────────

  - name: EURAXESS – Mathematics, first-stage researchers
    url:
      - https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_research_field%3A298&f%5B1%5D=job_research_profile%3A447
      - https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_research_field%3A299&f%5B1%5D=job_research_profile%3A447
      - https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_research_field%3A306&f%5B1%5D=job_research_profile%3A447
    item: article.ecl-content-item
    link: h3 a
    pages: 3
    filter: [phd]
    details: true
    max_details: 40

  - name: EURAXESS – keyword search
    url:
      - https://euraxess.ec.europa.eu/jobs/search?keywords=topology
      - https://euraxess.ec.europa.eu/jobs/search?keywords=knot
      - https://euraxess.ec.europa.eu/jobs/search?keywords=homotopy
    item: article.ecl-content-item
    link: h3 a
    filter: [phd, math, topic]
    details: true

  - name: EMS job portal
    url: https://euromathsoc.org/jobs
    link_pattern: /jobs/[^/?]+-\d+$
    filter: [phd]
    details: true

  - name: MathHire (EMS/DMV)
    url: https://mathhire.org/jobs/academia
    link_pattern: /jobs/\d+
    filter: [phd]
    details: true

  - name: MathJobs (AMS) – European PhD ads
    url: https://www.mathjobs.org/jobs/job
    link_pattern: /jobs/list/\d+
    filter: [phd]
    europe_only: true
    details: true
    max_details: 30

  - name: AcademicJobsOnline – Mathematics
    url: https://academicjobsonline.org/ajo/Mathematics
    link_pattern: /ajo/jobs/\d+
    filter: [phd]
    europe_only: true
    details: true

  - name: Nature Careers – Maths PhD positions in Europe
    url: https://www.nature.com/naturecareers/jobs/mathematics/phd-position/europe/
    link_pattern: /naturecareers/job/\d+
    filter: [phd, math]
    details: true

  - name: Times Higher Education – Maths PhDs
    url: https://www.timeshighereducation.com/unijobs/listings/phd/mathematics/
    link_pattern: /unijobs/listing/\d+
    filter: [phd, math]
    details: true

  - name: Science Careers – Maths in Europe
    url: https://jobs.sciencecareers.org/jobs/mathematics/europe/
    link_pattern: /job/\d+
    filter: [phd, math]
    details: true

  - name: EuroScienceJobs – Mathematics
    url: https://www.eurosciencejobs.com/jobs/mathematics
    link_pattern: /job_display/\d+
    filter: [phd, math]
    details: true

  - name: myScience – Mathematics (Europe)
    url:
      - https://www.myscience.org/en/jobs/Mathematics
      - https://www.myscience.de/en/jobs/Mathematics
      - https://www.myscience.ch/en/jobs/Mathematics
    link_pattern: /jobs/id\d+
    title_from_page: true
    filter: [phd, math]
    europe_only: true
    details: true
    max_details: 30

  - name: cvgmt (Pisa) positions board
    url: https://cvgmt.sns.it/positions/
    link_pattern: /position/\d+/
    filter: [phd]
    details: true

# ─── National portals ──────────────────────────────────────────────────────────

  - name: jobs.ac.uk – maths & topology PhDs (UK, Ireland)
    url:
      - https://www.jobs.ac.uk/search/?keywords=phd+mathematics
      - https://www.jobs.ac.uk/search/?keywords=topology
      - https://www.jobs.ac.uk/search/?keywords=knot+theory
      - https://www.jobs.ac.uk/search/?keywords=pure+mathematics+studentship
    link_pattern: /job/[A-Z0-9]+/
    country: United Kingdom
    filter: [phd, math]
    details: true
    max_details: 30

  - name: AcademicTransfer (Netherlands)
    url: https://www.academictransfer.com/sitemap-vacancies.xml
    links: raw
    link_pattern: /en/jobs/\d+/[^/]*(phd|doctor|promov|predoc)[^/]*/
    country: Netherlands
    filter: [phd, math]
    details: true
    max_details: 40

  - name: MUR – Italian PhD calls (maths & computer science area)
    url: https://bandi.mur.gov.it/doctorate.php/public/cercaFellowship?jf_comp_status_id=2-3&bb_type_code=%25&idarea=01&azione=cerca
    link_pattern: /doctorate\.php/public/fellowship/id_fellow/\d+
    country: Italy
    kind: school
    filter: []
    details: true
    max_details: 40

  - name: ADUM – French thesis offers
    url: https://adum.fr/as/ed/propositionFR.pl
    link_pattern: voirproposition\.pl
    country: France
    filter: [math]
    listing_filter: []
    details: true
    max_details: 40

