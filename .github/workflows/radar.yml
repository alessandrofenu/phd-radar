name: PhD Radar

on:
  schedule:
    - cron: "17 */4 * * *"      # every 4 hours (UTC)
  workflow_dispatch:
    inputs:
      rescan:
        description: "Re-check postings rejected earlier (tick after editing keywords or filters)"
        type: boolean
        default: false
      reset:
        description: "Start from empty data (needed only after changing the password)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["sources.yaml", "profiles.yaml", "radar/**", "site/**"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Scan sources
        env:
          RADAR_PASSWORD: ${{ secrets.RADAR_PASSWORD }}
          RADAR_RESCAN: ${{ inputs.rescan && '1' || '0' }}
          RADAR_RESET: ${{ inputs.reset && '1' || '0' }}
        run: python -m radar run --out _site --state-url "${{ steps.pages.outputs.base_url }}/data.enc"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows in repositories without activity for 60 days.
      # Re-enabling the workflow on every run keeps the schedule alive.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/radar.yml/enable" || true
