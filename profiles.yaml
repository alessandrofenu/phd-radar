# Terms that identify a doctoral position (any language). Matching is by word prefix.
phd_terms: [phd, ph d, dphil, doctoral, doctorate, doktorand, doktorat, promotion, promovend,
  promotie, promotieplaats, doctorat, doctorant, thèse, dottorato, dottorand, doctorado,
  doctoranda, doutoramento, predoc, pre doc, early stage researcher, esr, first stage researcher,
  studentship, research student, stipendiat, doktorgrad, doktorandtjänst, väitöskirja,
  graduate school, graduate program, doctoral school, doctoral candidate, doctoral researcher,
  msca doctoral, doctoral network, bando, bigs, imprs]

# Terms that identify mathematics. A posting counts as mathematics if one of these appears in
# its title or listing text, or at least 3 times in its full text.
math_terms: [mathemat, matemat, mathématique, wiskunde, topolog, algebra, geometr, homotop,
  homology, cohomolog, knot, manifold, number theory, combinatoric, category theory,
  representation theory, differential equation, probability theory]

# Phrases that, in the full text of a posting, show it really is a doctoral position
# (a bare "PhD" there is not enough: faculty ads say "PhD required").
phd_body_terms: [phd position, phd student, phd candidate, phd fellow, phd scholarship,
  phd studentship, phd project, phd programme, phd program, phd research fellow, phd stipend,
  phd opportunit, doctoral student, doctoral candidate, doctoral position, doctoral researcher,
  doctoral fellow, doctoral programme, doctoral program, doctoral school, doctoral contract,
  doktorand, promotionsstelle, promotionsstudent, studentship, dottorato, borsa di dottorato,
  contrat doctoral, doctorant, sujet de these, promovend, promotieplaats, stipendiat, predoc,
  praedoc, prae doc, early stage researcher, doctoraatsbursaal, doktorandtjanst]

# If a title contains one of these and no phd term, the posting is dropped.
exclude_title_terms: [postdoc, post doc, postdoctoral, post doctoral, professor, professur,
  lecturer, tenure, habilitation, senior, research associate, research fellow, fellowship for
  experienced, principal investigator, group leader, laboratory technician, administrat,
  secretary, manager, engineer, software, marie curie postdoctoral, professeur,
  maitre de conferences, educator, teacher, contract, coding expert, benchmark specialist]

# A title containing one of these is always dropped, even if it also mentions a PhD.
hard_exclude_title_terms: [with doctorate, mit doktorat, with a doctorate, rank of professor,
  professorship, post doctoral, postdoctoral, postdoc, coding expert, benchmark specialist]
